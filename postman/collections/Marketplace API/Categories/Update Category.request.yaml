$kind: http-request
description: "Generated from cURL: curl -X PUT \"{{base_url}}/categories/{{category_id}}\" -H \"Authorization: Bearer {{token}}\" -H \"Content-Type: application/json\" -d '{\"name\": \"UI Design Updated\", \"description\": \"Kategori untuk produk desain UI yang telah diperbarui\"}'"
url: "{{base_url}}/categories/{{category_id}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"name\": \"UI Design Updated\",\r

    \    \"description\": \"Kategori untuk produk desain UI yang telah diperbarui\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code sesuai", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response success true", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
      });
      pm.test("Nama kategori berhasil diupdate", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data.name).to.eql("UI Design Updated");
      });
      // Update category_id jika response mengembalikan id baru
      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          pm.environment.set("category_id", jsonData.data.id);
          console.log("Category ID diperbarui:", jsonData.data.id);
      }
    language: text/javascript
order: 3000
