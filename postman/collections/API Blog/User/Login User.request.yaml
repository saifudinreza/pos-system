$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: "{\r

    \    \"name\": \"UI Kit Premium\",\r

    \    \"price\": 150000,\r

    \    \"description\": \"Paket UI Kit lengkap untuk desainer profesional\",\r

    \    \"file_url\": \"https://example.com/uikit-premium.zip\",\r

    \    \"category_id\": {{category_id}}\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.token) {
          pm.environment.set("token", res.token);
          console.log("Token saved:", res.token);
      }
    language: text/javascript
order: 2000
