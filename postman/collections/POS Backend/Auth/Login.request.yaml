$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: "{\r

    \    \"email\": \"admin@gmail.com\",\r

    \    \"password\": \"admin123\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "const res = pm.response.json();\r

      \r

      if (res.data && res.data.token) {\r

      \    pm.environment.set(\"token\", res.data.token);\r

      \    console.log(\"Token tersimpan:\", res.data.token);\r

      }"
    language: text/javascript
order: 2000
