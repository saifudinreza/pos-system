$kind: http-request
url: "{{base_url}}/products"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: category_id
      value: "1"
    - type: text
      key: name
      value: Mie Sedaap Goreng
    - type: text
      key: sku
      value: MKN-011
    - type: text
      key: price
      value: "3000"
    - type: text
      key: stock
      value: "50"
    - type: text
      key: stock_alert
      value: "10"
    - type: text
      key: is_active
      value: "true"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 1000
